<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Happy Birthday ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Para abrirlo bien en iPhone desde WhatsApp:
  1. Tocar el archivo para previsualizarlo.
  2. Tocar el ícono de compartir (cuadro con flecha hacia arriba).
  3. Elegir "Abrir en Safari" (o "Copiar" y pegar en Safari).
  Así se ejecuta como página web real, con todas las animaciones.
-->
<style>
  :root{
    --shift-x: 0px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background: radial-gradient(circle at 50% 12%, #ff4fa3 0%, #b21068 45%, #26051f 100%);
    font-family:'Poppins', sans-serif;
  }

  .app{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    opacity:0;
    animation: appIn 1.2s ease forwards;
  }
  @keyframes appIn{ to{ opacity:1; } }

  /* ---------- fondo: corazones flotando ---------- */
  #bg-hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .bg-heart{
    position:absolute;
    color:rgba(255,255,255,0.16);
    animation-name: floatUp;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes floatUp{
    0%   { transform: translateY(0) rotate(0deg); opacity:0.12; }
    50%  { transform: translateY(-22px) rotate(8deg); opacity:0.32; }
    100% { transform: translateY(0) rotate(0deg); opacity:0.12; }
  }

  /* ---------- barra de cuenta regresiva (siempre visible) ---------- */
  .countdown-bar{
    position:relative;
    z-index:10;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    background:rgba(20,4,20,0.32);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:#fff5ec;
    text-align:center;
  }
  .countdown-label{
    font-size:.72rem;
    opacity:.85;
    display:block;
  }
  .countdown{
    font-weight:600;
    font-size:.95rem;
    letter-spacing:.2px;
  }

  /* ---------- escenario principal ---------- */
  .stage{
    position:relative;
    z-index:5;
    flex:1 1 auto;
    width:100%;
    overflow:hidden;
  }

  /* --- escena 1: árbol --- */
  .tree-wrap{
    position:absolute;
    left:50%;
    top:50%;
    width:min(88vw, 380px);
    transform:translate(-50%,-50%) scale(1);
    transition:transform 1.5s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }
  .tree-wrap.shift{
    transform:translate(calc(-50% + var(--shift-x)), -50%) scale(0.74);
  }

  .tree-scene{
    position:relative;
    height:clamp(380px, 56vh, 460px);
  }
  .ground{
    position:absolute;
    left:-10%; right:-10%;
    bottom:28px;
    border-bottom:2px solid rgba(255,255,255,0.55);
  }
  .trunk{
    position:absolute;
    bottom:28px;
    left:50%;
    width:15px;
    height:108px;
    background:linear-gradient(#8a5a2b,#5c3a1a);
    border-radius:5px 5px 0 0;
    transform-origin:bottom center;
    transform:translateX(-50%) scaleY(0);
    transition:transform 1.6s cubic-bezier(.34,1.56,.64,1);
  }
  .trunk.grow{ transform:translateX(-50%) scaleY(1); }

  .canopy{
    position:absolute;
    left:50%;
    bottom:136px; /* trunk height (108) + trunk bottom offset (28) */
    width:0;
    height:0;
  }
  .canopy-heart{
    position:absolute;
    bottom:0;
    left:0;
    transform:translate(-50%,0) scale(0);
    opacity:0;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1), opacity .55s ease;
    line-height:1;
  }
  .canopy-heart.bloom{
    transform:translate(-50%,0) scale(1);
    opacity:1;
  }

  .falling-heart{
    position:absolute;
    left:0;
    top:0;
    animation-name:fall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
    pointer-events:none;
  }
  @keyframes fall{
    0%   { transform: translate(0,0) rotate(0deg); opacity:1; }
    100% { transform: translate(var(--sway,20px), var(--fall,260px)) rotate(300deg); opacity:0; }
  }

  /* --- escena 2: mensaje --- */
  .text-wrap{
    position:absolute;
    left:5%;
    top:50%;
    width:min(56vw, 300px);
    transform:translateY(-50%) translateX(-14px);
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease, transform 1s ease;
  }
  .text-wrap.show{
    opacity:1;
    transform:translateY(-50%) translateX(0);
    pointer-events:auto;
  }
  .message-panel{
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:20px;
    padding:18px 16px;
    box-shadow:0 12px 40px rgba(0,0,0,0.35);
  }
  .message{
    color:#fff8f2;
    font-family:'Dancing Script', cursive;
    font-size:clamp(1.05rem, 4.6vw, 1.4rem);
    line-height:1.5;
    white-space:pre-line;
    text-shadow:0 1px 6px rgba(0,0,0,0.35);
  }
  .message::after{
    content:'';
    display:inline-block;
    width:2px;
    height:1em;
    background:#fff8f2;
    margin-left:2px;
    vertical-align:middle;
    animation: blink 0.9s steps(1) infinite;
  }
  .message.done::after{ display:none; }
  @keyframes blink{ 50%{ opacity:0; } }
</style>
</head>
<body>

  <div id="bg-hearts"></div>

  <div class="app">
    <div class="countdown-bar">
      <div>
        <span class="countdown-label">Esperando tu cumple en...</span>
        <span class="countdown" id="countdown">calculando...</span>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="tree-wrap" id="treeWrap">
        <div class="tree-scene" id="treeScene">
          <div class="ground"></div>
          <div class="trunk" id="trunk"></div>
          <div class="canopy" id="canopy"></div>
        </div>
      </div>

      <div class="text-wrap" id="textWrap">
        <div class="message-panel">
          <div class="message" id="message"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  /* =============== EDITA AQUÍ =============== */
  const FECHA_CUMPLE = "2026-08-20T00:00:00"; // día del cumpleaños
  const MENSAJE = `Para mi princesa preciosa y hermosa: 💕

Estamos a pocas horas del mejor día del año, no puedo esperar más para abrazarte y darte muchos besos por ser la cumpleañera más preciosa del universo; pronto verás, que tendremos otro lindo cumpleaños juntos.

Te amo hasta el infinito y más allá, mi pre-cumpleañera.`;
  /* ============================================ */

  const colors = ['#e0245e','#ff4d6d','#ff85a1','#c21e56','#ff6b81'];

  /* ---------- 1. corazones flotando de fondo ---------- */
  (function backgroundHearts(){
    const container = document.getElementById('bg-hearts');
    const frag = document.createDocumentFragment();
    const total = 18;
    for(let i=0;i<total;i++){
      const h = document.createElement('span');
      h.className = 'bg-heart';
      h.textContent = '♥';
      const size = 12 + Math.random()*24;
      h.style.left = Math.random()*100 + 'vw';
      h.style.top = Math.random()*100 + 'vh';
      h.style.fontSize = size + 'px';
      h.style.animationDuration = (4 + Math.random()*5) + 's';
      h.style.animationDelay = (Math.random()*5) + 's';
      frag.appendChild(h);
    }
    container.appendChild(frag);
  })();

  /* ---------- 2. cuenta regresiva (siempre activa) ---------- */
  const target = new Date(FECHA_CUMPLE);
  const countdownEl = document.getElementById('countdown');

  function updateCountdown(){
    const diff = target - new Date();
    if(diff <= 0){
      countdownEl.textContent = '¡Feliz cumpleaños, mi princesa! 🎉❤️';
      clearInterval(timer);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff / 3600000) % 24);
    const m = Math.floor((diff / 60000) % 60);
    const s = Math.floor((diff / 1000) % 60);
    countdownEl.textContent = `${d} días ${h} horas ${m} min ${s} seg`;
  }
  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);

  /* ---------- 3. utilidades del corazón (curva paramétrica) ---------- */
  function heartPoint(t){
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return { x, y };
  }

  const canopy = document.getElementById('canopy');
  const CANOPY_SCALE = 6.6;

  function bloomCanopy(){
    const pointCount = 800;
    const pts = [];
    let minY = Infinity;

    for(let i=0;i<pointCount;i++){
      const t = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()); // relleno uniforme del área
      const base = heartPoint(t);
      const x = base.x * r;
      const y = base.y * r;
      pts.push({ x, y, r });
      if(y < minY) minY = y;
    }

    const frag = document.createDocumentFragment();
    pts.forEach((p, idx) => {
      const heart = document.createElement('span');
      heart.className = 'canopy-heart';
      heart.textContent = '❤';
      heart.style.color = colors[idx % colors.length];
      heart.style.fontSize = (8 + Math.random()*8) + 'px';
      heart.style.left = (p.x * CANOPY_SCALE) + 'px';
      heart.style.bottom = ((p.y - minY) * CANOPY_SCALE) + 'px';
      heart.style.transitionDelay = (p.r*1.0 + Math.random()*0.5) + 's';
      frag.appendChild(heart);
    });
    canopy.appendChild(frag);

    // segundo frame para que la transición de "bloom" se dispare
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        canopy.querySelectorAll('.canopy-heart').forEach(h => h.classList.add('bloom'));
      });
    });
  }

  /* ---------- 4. corazones cayendo (continuo) ---------- */
  function startFallingHearts(){
    const scene = document.getElementById('treeScene');
    const sceneHeight = scene.clientHeight;
    const groundTop = sceneHeight - 28;
    const canopyTop = groundTop - 136 - (29 * CANOPY_SCALE); // borde superior aprox. de la copa

    function spawnHeart(){
      const heart = document.createElement('span');
      heart.className = 'falling-heart';
      heart.textContent = '❤';
      heart.style.color = colors[Math.floor(Math.random()*colors.length)];
      heart.style.fontSize = (8 + Math.random()*9) + 'px';
      const startTop = canopyTop + 15 + Math.random()*(29*CANOPY_SCALE - 30);
      heart.style.left = (scene.clientWidth/2 - 100 + Math.random()*200) + 'px';
      heart.style.top = startTop + 'px';
      const duration = 2.2 + Math.random()*2.2;
      heart.style.setProperty('--sway', (Math.random()*90 - 45) + 'px');
      heart.style.setProperty('--fall', (groundTop - startTop) + 'px');
      heart.style.animationDuration = duration + 's';
      scene.appendChild(heart);
      setTimeout(() => heart.remove(), duration*1000);
    }

    setInterval(() => {
      const batch = 3 + Math.floor(Math.random()*3); // 3 a 5 por tanda
      for(let i=0;i<batch;i++) spawnHeart();
    }, 220);
  }

  /* ---------- 5. escena 2: el árbol se desplaza y aparece el texto ---------- */
  function shiftTreeAndReveal(){
    const wrap = document.getElementById('treeWrap');
    const stage = document.getElementById('stage');
    const wrapWidth = wrap.getBoundingClientRect().width;
    const stageWidth = stage.getBoundingClientRect().width;
    const rightMargin = Math.max(14, stageWidth * 0.03);
    const targetCenterX = stageWidth - rightMargin - wrapWidth/2;
    const currentCenterX = stageWidth/2;
    const deltaX = targetCenterX - currentCenterX;

    wrap.style.setProperty('--shift-x', deltaX + 'px');
    wrap.classList.add('shift');

    setTimeout(() => {
      const textWrap = document.getElementById('textWrap');
      textWrap.classList.add('show');
      typeWriter(document.getElementById('message'), MENSAJE);
    }, 900);
  }

  function typeWriter(el, text, speed = 38){
    let i = 0;
    el.textContent = '';
    (function step(){
      if(i < text.length){
        el.textContent += text.charAt(i);
        i++;
        setTimeout(step, speed);
      } else {
        el.classList.add('done');
      }
    })();
  }

  /* ---------- 6. orquestación completa ---------- */
  window.addEventListener('load', () => {
    const trunk = document.getElementById('trunk');

    setTimeout(() => trunk.classList.add('grow'), 300);

    trunk.addEventListener('transitionend', () => {
      bloomCanopy();
      // la copa termina de florecer ~2.3s después de empezar
      setTimeout(startFallingHearts, 1800);
      setTimeout(shiftTreeAndReveal, 3600);
    }, { once:true });
  });
</script>

</body>
</html>
