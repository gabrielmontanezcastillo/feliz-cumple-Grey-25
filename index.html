<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Happy Birthday ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Para abrirlo bien en iPhone desde WhatsApp:
  1. Tocar el archivo para previsualizarlo.
  2. Tocar el ícono de compartir (cuadro con flecha hacia arriba).
  3. Elegir "Abrir en Safari" (o "Copiar" y pegar en Safari).
  Así se ejecuta como página web real, con todas las animaciones.
-->
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background: radial-gradient(circle at 50% 12%, #ff4fa3 0%, #b21068 45%, #26051f 100%);
    font-family:'Poppins', sans-serif;
  }

  .app{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    opacity:0;
    animation: appIn 1.2s ease forwards;
  }
  @keyframes appIn{ to{ opacity:1; } }

  /* ---------- fondo: corazones flotando ---------- */
  #bg-hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .bg-heart{
    position:absolute;
    color:rgba(255,255,255,0.16);
    animation-name: floatUp;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes floatUp{
    0%   { transform: translateY(0) rotate(0deg); opacity:0.12; }
    50%  { transform: translateY(-22px) rotate(8deg); opacity:0.32; }
    100% { transform: translateY(0) rotate(0deg); opacity:0.12; }
  }

  /* ---------- barra de cuenta regresiva (siempre visible) ---------- */
  .countdown-bar{
    position:relative;
    z-index:10;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    background:rgba(20,4,20,0.32);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:#fff5ec;
    text-align:center;
  }
  .countdown-label{
    font-size:.72rem;
    opacity:.85;
    display:block;
  }
  .countdown{
    font-weight:600;
    font-size:.95rem;
    letter-spacing:.2px;
  }

  /* ---------- escenario principal: dos columnas fijas ---------- */
  .stage{
    position:relative;
    z-index:5;
    flex:1 1 auto;
    width:100%;
    overflow:hidden;
  }

  /* capa exclusiva para los corazones que caen: va SOBRE el texto */
  .falling-layer{
    position:absolute;
    inset:0;
    z-index:6;
    pointer-events:none;
    overflow:hidden;
  }

  .stage-columns{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    align-items:center;
    gap:clamp(8px, 3vw, 18px);
    padding:0 clamp(10px, 4vw, 18px);
  }

  /* --- columna del árbol (izquierda) --- */
  .tree-col{
    flex:0 0 auto;
    width:38%;
    max-width:190px;
    position:relative;
  }
  .tree-scene{
    position:relative;
    height:clamp(260px, 44vh, 340px);
  }
  .ground{
    position:absolute;
    left:-15%; right:-15%;
    bottom:22px;
    border-bottom:2px solid rgba(255,255,255,0.55);
  }
  .trunk{
    position:absolute;
    bottom:22px;
    left:50%;
    width:12px;
    height:86px;
    background:linear-gradient(#8a5a2b,#5c3a1a);
    border-radius:5px 5px 0 0;
    transform-origin:bottom center;
    transform:translateX(-50%) scaleY(0);
    transition:transform 1.6s cubic-bezier(.34,1.56,.64,1);
  }
  .trunk.grow{ transform:translateX(-50%) scaleY(1); }

  .canopy{
    position:absolute;
    left:50%;
    bottom:108px; /* trunk height (86) + trunk bottom offset (22) */
    width:0;
    height:0;
  }
  .canopy-heart{
    position:absolute;
    bottom:0;
    left:0;
    transform:translate(-50%,0) scale(0);
    opacity:0;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1), opacity .55s ease;
    line-height:1;
  }
  .canopy-heart.bloom{
    transform:translate(-50%,0) scale(1);
    opacity:1;
  }

  .falling-heart{
    position:absolute;
    left:0;
    top:0;
    animation-name:fall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes fall{
    0%   { transform: translate(0,0) rotate(0deg); opacity:1; }
    100% { transform: translate(var(--sway,20px), var(--fall,260px)) rotate(300deg); opacity:0; }
  }

  /* --- columna del mensaje (derecha) --- */
  .text-col{
    flex:1 1 auto;
    min-width:0;
    opacity:0;
    transform:translateX(-12px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .text-col.show{
    opacity:1;
    transform:translateX(0);
  }
  .message-panel{
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:20px;
    padding:16px 14px;
    max-width:340px;
    box-shadow:0 12px 40px rgba(0,0,0,0.35);
  }
  .message{
    color:#fff8f2;
    font-family:'Dancing Script', cursive;
    font-size:clamp(1rem, 4.4vw, 1.3rem);
    line-height:1.48;
    white-space:pre-line;
    text-shadow:0 1px 6px rgba(0,0,0,0.35);
  }
  .message::after{
    content:'';
    display:inline-block;
    width:2px;
    height:1em;
    background:#fff8f2;
    margin-left:2px;
    vertical-align:middle;
    animation: blink 0.9s steps(1) infinite;
  }
  .message.done::after{ display:none; }
  @keyframes blink{ 50%{ opacity:0; } }
</style>
</head>
<body>

  <div id="bg-hearts"></div>

  <div class="app">
    <div class="countdown-bar">
      <div>
        <span class="countdown-label">Esperando tu cumple en...</span>
        <span class="countdown" id="countdown">calculando...</span>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="falling-layer" id="fallingLayer"></div>

      <div class="stage-columns">
        <div class="tree-col">
          <div class="tree-scene" id="treeScene">
            <div class="ground"></div>
            <div class="trunk" id="trunk"></div>
            <div class="canopy" id="canopy"></div>
          </div>
        </div>

        <div class="text-col" id="textCol">
          <div class="message-panel">
            <div class="message" id="message"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  /* =============== EDITA AQUÍ =============== */
  const FECHA_CUMPLE = "2026-08-20T00:00:00"; // día del cumpleaños
  const MENSAJE = `Para mi princesa preciosa y hermosa: 💕

Estamos a pocas horas del mejor día del año, no puedo esperar más para abrazarte y darte muchos besos por ser la cumpleañera más preciosa del universo; pronto verás, que tendremos otro lindo cumpleaños juntos.

Te amo hasta el infinito y más allá, mi pre-cumpleañera.`;
  /* ============================================ */

  const colors = ['#e0245e','#ff4d6d','#ff85a1','#c21e56','#ff6b81'];

  /* ---------- 1. corazones flotando de fondo ---------- */
  (function backgroundHearts(){
    const container = document.getElementById('bg-hearts');
    const frag = document.createDocumentFragment();
    const total = 18;
    for(let i=0;i<total;i++){
      const h = document.createElement('span');
      h.className = 'bg-heart';
      h.textContent = '♥';
      const size = 12 + Math.random()*24;
      h.style.left = Math.random()*100 + 'vw';
      h.style.top = Math.random()*100 + 'vh';
      h.style.fontSize = size + 'px';
      h.style.animationDuration = (4 + Math.random()*5) + 's';
      h.style.animationDelay = (Math.random()*5) + 's';
      frag.appendChild(h);
    }
    container.appendChild(frag);
  })();

  /* ---------- 2. cuenta regresiva (siempre activa) ---------- */
  const target = new Date(FECHA_CUMPLE);
  const countdownEl = document.getElementById('countdown');

  function updateCountdown(){
    const diff = target - new Date();
    if(diff <= 0){
      countdownEl.textContent = '¡Feliz cumpleaños, mi princesa! 🎉❤️';
      clearInterval(timer);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff / 3600000) % 24);
    const m = Math.floor((diff / 60000) % 60);
    const s = Math.floor((diff / 1000) % 60);
    countdownEl.textContent = `${d} días ${h} horas ${m} min ${s} seg`;
  }
  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);

  /* ---------- 3. utilidades del corazón (curva paramétrica) ---------- */
  function heartPoint(t){
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return { x, y };
  }

  const canopy = document.getElementById('canopy');
  const CANOPY_SCALE = 3.8; // radio de la copa ajustado a la columna angosta
  const CANOPY_Y_SPAN = 29 * CANOPY_SCALE;   // alto aprox. de la copa
  const TRUNK_HEIGHT = 86;
  const GROUND_OFFSET = 22;
  const CANOPY_ANCHOR = TRUNK_HEIGHT + GROUND_OFFSET; // 108, debe coincidir con el CSS

  function bloomCanopy(){
    const pointCount = 800;
    const pts = [];
    let minY = Infinity;

    for(let i=0;i<pointCount;i++){
      const t = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()); // relleno uniforme del área
      const base = heartPoint(t);
      const x = base.x * r;
      const y = base.y * r;
      pts.push({ x, y, r });
      if(y < minY) minY = y;
    }

    const frag = document.createDocumentFragment();
    pts.forEach((p, idx) => {
      const heart = document.createElement('span');
      heart.className = 'canopy-heart';
      heart.textContent = '❤';
      heart.style.color = colors[idx % colors.length];
      heart.style.fontSize = (6 + Math.random()*6) + 'px';
      heart.style.left = (p.x * CANOPY_SCALE) + 'px';
      heart.style.bottom = ((p.y - minY) * CANOPY_SCALE) + 'px';
      heart.style.transitionDelay = (p.r*1.0 + Math.random()*0.5) + 's';
      frag.appendChild(heart);
    });
    canopy.appendChild(frag);

    // segundo frame para que la transición de "bloom" se dispare
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        canopy.querySelectorAll('.canopy-heart').forEach(h => h.classList.add('bloom'));
      });
    });
  }

  /* ---------- 4. corazones cayendo sobre TODO el escenario (incluido el texto) ---------- */
  function startFallingHearts(){
    const stage = document.getElementById('stage');
    const scene = document.getElementById('treeScene');
    const layer = document.getElementById('fallingLayer');

    function geometry(){
      const stageRect = stage.getBoundingClientRect();
      const sceneRect = scene.getBoundingClientRect();
      const canopyCenterX = sceneRect.left + sceneRect.width/2 - stageRect.left;
      const groundY = sceneRect.top - stageRect.top + sceneRect.height - GROUND_OFFSET;
      const canopyTopY = groundY - CANOPY_ANCHOR - CANOPY_Y_SPAN;
      return {
        stageWidth: stageRect.width,
        canopyCenterX,
        groundY,
        canopyTopY
      };
    }

    function spawnHeart(){
      const g = geometry();
      const heart = document.createElement('span');
      heart.className = 'falling-heart';
      heart.textContent = '❤';
      heart.style.color = colors[Math.floor(Math.random()*colors.length)];
      heart.style.fontSize = (8 + Math.random()*9) + 'px';

      const startX = g.canopyCenterX + (Math.random()*2 - 1) * (16*CANOPY_SCALE);
      const startY = g.canopyTopY + Math.random()*CANOPY_Y_SPAN;
      heart.style.left = startX + 'px';
      heart.style.top = startY + 'px';

      const duration = 2.4 + Math.random()*2.4;
      // deriva mayormente hacia la derecha, para que también caigan sobre el texto
      const maxRightDrift = Math.max(60, g.stageWidth - startX - 24);
      const sway = -20 + Math.random()*(maxRightDrift + 20);
      heart.style.setProperty('--sway', sway + 'px');
      heart.style.setProperty('--fall', (g.groundY - startY + 40) + 'px');
      heart.style.animationDuration = duration + 's';

      layer.appendChild(heart);
      setTimeout(() => heart.remove(), duration*1000);
    }

    setInterval(() => {
      const batch = 3 + Math.floor(Math.random()*3); // 3 a 5 por tanda
      for(let i=0;i<batch;i++) spawnHeart();
    }, 220);
  }

  /* ---------- 5. revelar el mensaje ---------- */
  function revealText(){
    document.getElementById('textCol').classList.add('show');
    typeWriter(document.getElementById('message'), MENSAJE);
  }

  function typeWriter(el, text, speed = 38){
    let i = 0;
    el.textContent = '';
    (function step(){
      if(i < text.length){
        el.textContent += text.charAt(i);
        i++;
        setTimeout(step, speed);
      } else {
        el.classList.add('done');
      }
    })();
  }

  /* ---------- 6. orquestación completa ---------- */
  window.addEventListener('load', () => {
    const trunk = document.getElementById('trunk');

    setTimeout(() => trunk.classList.add('grow'), 300);

    trunk.addEventListener('transitionend', () => {
      bloomCanopy();
      setTimeout(startFallingHearts, 1500);
      setTimeout(revealText, 2100);
    }, { once:true });
  });
</script>

</body>
</html>
